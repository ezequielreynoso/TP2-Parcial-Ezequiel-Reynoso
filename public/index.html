<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ingreso de productos</title>
</head>

<body>

    <h1>Ingresar producto</h1>

    <form action="/productos/ingreso" method="POST">

        <div>
            <label for="nombre">Nombre:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                required
            >
        </div>

        <br>

        <div>
            <label for="precio">Precio:</label>
            <input
                type="number"
                id="precio"
                name="precio"
                required
            >
        </div>

        <br>

        <div>
            <label for="descripcion">Descripción:</label>
            <input
                type="text"
                id="descripcion"
                name="descripcion"
                required
            >
        </div>

        <br>

        <div>
            <label for="foto">URL de foto:</label>
            <input
                type="text"
                id="foto"
                name="foto"
            >
        </div>

        <br>

        <button type="submit">
            Guardar producto
        </button>

    </form>

</body>

</html>
